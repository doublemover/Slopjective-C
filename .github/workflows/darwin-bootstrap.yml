name: Darwin arm64 bootstrap probe
on:
  workflow_dispatch:
    inputs:
      runtime_registration:
        description: Build and exercise the experimental Objective-C 3 runtime
        type: boolean
        default: false
      runtime_sanitizers:
        description: Include native installed ASan and UBSan consumer witnesses
        type: boolean
        default: false
      candidate:
        description: Optional immutable package pin for managed SDK lifecycle replay
        required: false
        type: string
      replacement:
        description: Optional second package pin for the managed hard-cutover replay
        required: false
        type: string
  pull_request:
    paths:
      - ".github/workflows/darwin-bootstrap.yml"
      - ".github/workflows/darwin-native-qualification.yml"
      - ".github/workflows/darwin-managed-replay.yml"
      - "scripts/objc3c_toolchain/cli.py"
      - "scripts/objc3c_toolchain/darwin_bootstrap.py"
      - "scripts/objc3c_toolchain/darwin_evidence.py"
      - "scripts/objc3c_toolchain/darwin_registration.py"
      - "scripts/objc3c_toolchain/darwin_compiler_cache.py"
      - "scripts/objc3c_toolchain/darwin_sdk*.py"
      - "scripts/objc3c_toolchain_runtime/runtime-profile.json"
      - "scripts/objc3c_toolchain_runtime/verify_runtime_profile.py"
      - "native/objc3c/src/runtime/platform/darwin_registration.c"
      - "native/objc3c/src/runtime/public/objc3_darwin.h"
      - "native/objc3c/src/runtime/public/objc3_collections.h"
      - "native/objc3c/src/runtime/public/objc3_stdlib_status.h"
      - "native/objc3c/src/runtime/public/objc3_text.h"
      - "native/objc3c/src/runtime/stdlib/collections_service.cpp"
      - "native/objc3c/src/runtime/stdlib/opaque_service_storage.h"
      - "native/objc3c/src/runtime/stdlib/stdlib_service_contract.h"
      - "native/objc3c/src/runtime/stdlib/text_service.cpp"
      - "native/objc3c/src/runtime/stdlib/text_utf8_decode.h"
      - "native/objc3c/tests/stdlib_map_count_test.cpp"
      - "native/objc3c/tests/text_scalar_boundary_test.cpp"
      - "native/objc3c/tests/test_assertion_policy.h"
      - "tests/clang_foundation/darwin_portable_services/**"
      - "tests/clang_foundation/darwin_registration/**"
      - "tests/clang_foundation/darwin_sanitizers/**"
      - "tests/tooling/test_darwin_bootstrap.py"
      - "tests/tooling/test_darwin_evidence.py"
      - "tests/tooling/test_darwin_registration.py"
      - "tests/tooling/test_darwin_sdk.py"
      - "tests/tooling/test_darwin_sdk_portable_services.py"
      - "tests/tooling/test_darwin_sdk_sanitizers.py"
      - "native/objc3c/src/runtime/concurrency/**"
      - "native/objc3c/src/runtime/services/error_service.cpp"
      - "native/objc3c/src/runtime/services/value_storage.h"
      - "native/objc3c/src/runtime/public/objc3_runtime_services.h"
      - "native/objc3c/src/runtime/public/objc3_async_c.h"
      - "tests/clang_foundation/darwin_task_services/**"
      - "toolchains/llvm/manifest.json"
      - "toolchains/llvm/patches/**"
      - "toolchains/llvm/cmake/**"
      - "toolchains/llvm/experimental/**"
permissions:
  contents: read
concurrency:
  group: darwin-bootstrap-${{ github.event.pull_request.number || github.ref }}${{ (inputs.candidate || inputs.replacement) && format('-managed-{0}', github.run_id) || inputs.runtime_sanitizers && '-sanitizers' || '' }}
  cancel-in-progress: true
jobs:
  qualification:
    if: ${{ !inputs.candidate && !inputs.replacement }}
    name: Apple Silicon Xcode ${{ matrix.xcode }} and SDK ${{ matrix.sdk }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - xcode: "16.4"
            xcode_build: "16F6"
            sdk: "15.5"
            artifact_suffix: ""
          - xcode: "26.3"
            xcode_build: "17C529"
            sdk: "26.2"
            artifact_suffix: "-xcode-26.3"
    uses: ./.github/workflows/darwin-native-qualification.yml
    with:
      xcode: ${{ matrix.xcode }}
      xcode_build: ${{ matrix.xcode_build }}
      sdk: ${{ matrix.sdk }}
      artifact_suffix: ${{ matrix.artifact_suffix }}
      runtime_registration: ${{ inputs.runtime_registration == true }}
      runtime_sanitizers: ${{ inputs.runtime_sanitizers == true }}
    permissions:
      actions: read
      contents: read
  managed_replay:
    if: ${{ inputs.candidate || inputs.replacement }}
    uses: ./.github/workflows/darwin-managed-replay.yml
    with:
      candidate: ${{ inputs.candidate }}
      replacement: ${{ inputs.replacement }}
    permissions:
      actions: read
      contents: read
