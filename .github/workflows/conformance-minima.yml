name: conformance-minima

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tests/conformance/**"
      - "tests/native/e2e/cross_lane/**"
      - "tests/tooling/fixtures/cross_lane_e2e/**"
      - "scripts/check_conformance_suite.ps1"
      - "scripts/check_objc3c_cross_lane_e2e.py"
      - "scripts/objc3c_workflow/actions/application_conformance.py"
      - "scripts/objc3c_workflow/action_catalog_conformance.py"
      - "scripts/objc3c_workflow/action_handlers_reporting_conformance_stress.py"
      - ".github/workflows/conformance-minima.yml"
  push:
    branches:
      - main
    paths:
      - "tests/conformance/**"
      - "tests/native/e2e/cross_lane/**"
      - "tests/tooling/fixtures/cross_lane_e2e/**"
      - "scripts/check_conformance_suite.ps1"
      - "scripts/check_objc3c_cross_lane_e2e.py"
      - "scripts/objc3c_workflow/actions/application_conformance.py"
      - "scripts/objc3c_workflow/action_catalog_conformance.py"
      - "scripts/objc3c_workflow/action_handlers_reporting_conformance_stress.py"
      - ".github/workflows/conformance-minima.yml"

permissions:
  contents: read

concurrency:
  group: conformance-minima-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance-minima:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
      CL_MPCount: "4"
      LLVM_PARALLEL_COMPILE_JOBS: "4"
      OBJC3C_NATIVE_BUILD_PARALLELISM: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python workflow dependencies
        run: python -m pip install --upgrade jsonschema

      - name: Resolve LLVM object-emission tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Resolve-Executable {
            param(
              [Parameter(Mandatory = $true)]
              [string] $Name,
              [string[]] $CandidateDirectories = @()
            )
            foreach ($directory in $CandidateDirectories) {
              if ([string]::IsNullOrWhiteSpace($directory)) {
                continue
              }
              $candidate = Join-Path $directory $Name
              if (Test-Path -LiteralPath $candidate -PathType Leaf) {
                return (Resolve-Path -LiteralPath $candidate).Path
              }
            }
            $command = Get-Command $Name -ErrorAction SilentlyContinue
            if ($null -ne $command -and -not [string]::IsNullOrWhiteSpace($command.Source)) {
              return $command.Source
            }
            return $null
          }

          $candidateDirectories = @()
          if (-not [string]::IsNullOrWhiteSpace($env:LLVM_ROOT)) {
            $candidateDirectories += (Join-Path $env:LLVM_ROOT "bin")
          }
          $candidateDirectories += "C:\Program Files\LLVM\bin"

          $llc = Resolve-Executable -Name "llc.exe" -CandidateDirectories $candidateDirectories
          if ([string]::IsNullOrWhiteSpace($llc)) {
            choco install llvm -y --no-progress
            $candidateDirectories = @("C:\Program Files\LLVM\bin") + $candidateDirectories
            $llc = Resolve-Executable -Name "llc.exe" -CandidateDirectories $candidateDirectories
          }
          if ([string]::IsNullOrWhiteSpace($llc)) {
            throw "llc.exe was not found after LLVM tool resolution"
          }

          $llvmBin = Split-Path -Parent $llc
          Add-Content -Path $env:GITHUB_PATH -Value $llvmBin
          Add-Content -Path $env:GITHUB_ENV -Value "OBJC3C_NATIVE_EXECUTION_LLC_PATH=$llc"

          $clangxx = Resolve-Executable -Name "clang++.exe" -CandidateDirectories @($llvmBin)
          if (-not [string]::IsNullOrWhiteSpace($clangxx)) {
            Add-Content -Path $env:GITHUB_ENV -Value "OBJC3C_NATIVE_EXECUTION_CLANG_PATH=$clangxx"
          }
          "Resolved llc: $llc"
          "Resolved clang++: $clangxx"

      - name: Install Node dependencies
        run: npm ci

      - name: Build native objc3c artifacts
        run: npm run objc3c -- build-native-binaries

      - name: Validate cross-lane Objective-C 3 E2E programs
        run: npm run objc3c -- validate-cross-lane-e2e

      - name: Verify conformance suite minima and required families
        run: npm run objc3c -- check-conformance-minima
