name: conformance-minima

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tests/conformance/**"
      - "tests/native/e2e/cross_lane/**"
      - "tests/tooling/fixtures/cross_lane_e2e/**"
      - "scripts/check_conformance_suite.ps1"
      - "scripts/check_objc3c_cross_lane_e2e.py"
      - "scripts/install_objc3c_ci_llvm.ps1"
      - "scripts/probe_objc3c_llvm_capabilities.py"
      - "scripts/objc3c_llvm_capability_probe/**"
      - "scripts/objc3c_workflow/action_catalog_core_capabilities.py"
      - "scripts/objc3c_workflow/action_handlers_core_capabilities.py"
      - "scripts/objc3c_workflow/actions/developer_tooling_llvm*.py"
      - "scripts/objc3c_workflow/actions/hosted_llvm_summary.py"
      - "scripts/objc3c_workflow/actions/application_conformance.py"
      - "scripts/objc3c_workflow/action_catalog_conformance.py"
      - "scripts/objc3c_workflow/action_handlers_reporting_conformance_stress.py"
      - ".github/workflows/conformance-minima.yml"
  push:
    branches:
      - main
    paths:
      - "tests/conformance/**"
      - "tests/native/e2e/cross_lane/**"
      - "tests/tooling/fixtures/cross_lane_e2e/**"
      - "scripts/check_conformance_suite.ps1"
      - "scripts/check_objc3c_cross_lane_e2e.py"
      - "scripts/install_objc3c_ci_llvm.ps1"
      - "scripts/probe_objc3c_llvm_capabilities.py"
      - "scripts/objc3c_llvm_capability_probe/**"
      - "scripts/objc3c_workflow/action_catalog_core_capabilities.py"
      - "scripts/objc3c_workflow/action_handlers_core_capabilities.py"
      - "scripts/objc3c_workflow/actions/developer_tooling_llvm*.py"
      - "scripts/objc3c_workflow/actions/hosted_llvm_summary.py"
      - "scripts/objc3c_workflow/actions/application_conformance.py"
      - "scripts/objc3c_workflow/action_catalog_conformance.py"
      - "scripts/objc3c_workflow/action_handlers_reporting_conformance_stress.py"
      - ".github/workflows/conformance-minima.yml"

permissions:
  contents: read

concurrency:
  group: conformance-minima-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance-minima:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
      CL_MPCount: "4"
      LLVM_PARALLEL_COMPILE_JOBS: "4"
      OBJC3C_NATIVE_BUILD_PARALLELISM: "4"
      OBJC3C_CI_LLVM_VERSION: "22.1.6"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python workflow dependencies
        run: python -m pip install --upgrade jsonschema

      - name: Install coherent LLVM toolchain
        shell: pwsh
        run: ./scripts/install_objc3c_ci_llvm.ps1

      - name: Install Node dependencies
        run: npm ci

      - name: Require hosted LLVM native object emission
        env:
          OBJC3C_REQUIRE_HOSTED_NATIVE_OBJECT_EMISSION: "1"
        run: npm run objc3c -- check-hosted-llvm-capabilities

      - name: Build native objc3c artifacts
        run: npm run objc3c -- build-native-binaries

      - name: Validate cross-lane Objective-C 3 E2E programs
        run: npm run objc3c -- validate-cross-lane-e2e

      - name: Verify conformance suite minima and required families
        run: npm run objc3c -- check-conformance-minima
