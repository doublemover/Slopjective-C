name: Site And Spec Quality

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.0"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15.0"
      - name: Install Node dependencies
        run: |
          npm install --global npm@12.2.1
          npm ci
      - name: Enforce generated-only objc3c-native docs drift contract
        run: npm run objc3c -- check-native-docs
      - name: Enforce generated-only published site drift contract
        run: npm run objc3c -- check-site
      - name: Run canonical maintainer lint workflow
        run: npm run objc3c -- lint
      - name: Run spec structural lint suite
        run: npm run objc3c -- lint-spec
