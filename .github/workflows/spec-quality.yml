name: Site And Spec Quality

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Node dependencies
        run: npm ci
      - name: Enforce generated-only objc3c-native docs drift contract
        run: npm run objc3c -- check-native-docs
      - name: Enforce generated-only published site drift contract
        run: npm run objc3c -- check-site
      - name: Run canonical maintainer lint workflow
        run: npm run objc3c -- lint
      - name: Run spec structural lint suite
        run: npm run objc3c -- lint-spec
