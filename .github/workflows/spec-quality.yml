name: Current compiler documentation and capabilities
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.0"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15.0"
      - name: Exact development dependencies
        run: |
          npm install --global npm@12.2.1
          npm ci
          python -m pip install uv==0.13.1
          uv sync --locked --group dev
      - name: Onboarding and generated feature authority
        run: |
          npx prettier --check README.md toolchains/llvm/README.md native/objc3c/src/clang_foundation/README.md docs/roadmap/linux_forward_development.md docs/roadmap/linux_source_packages.md docs/roadmap/linux_managed_call_abi.md docs/roadmap/linux_runtime_call_abi.md docs/roadmap/linux_managed_typed_errors.md docs/roadmap/linux_direct_dispatch.md docs/roadmap/linux_recursive_carriers.md docs/roadmap/linux_owned_block_captures.md docs/roadmap/linux_managed_arrays.md docs/roadmap/linux_managed_records.md docs/roadmap/linux_heap_storage.md docs/roadmap/linux_cxx_interfaces.md docs/roadmap/linux_immutable_packages.md docs/roadmap/linux_public_carriers.md docs/roadmap/linux_public_errors.md docs/roadmap/linux_ownership_projections.md docs/roadmap/linux_public_module_surfaces.md docs/roadmap/linux_api_availability.md docs/roadmap/linux_module_spi.md docs/support/linux_managed_array_acceptance.json docs/support/linux_managed_record_acceptance.json docs/support/linux_heap_storage_acceptance.json docs/support/linux_cxx_interface_acceptance.json docs/support/linux_explicit_source_graph_acceptance.json docs/support/linux_immutable_package_acceptance.json docs/support/linux_public_core_acceptance.json docs/support/linux_public_core_latency.json docs/support/linux_ownership_projection_acceptance.json docs/support/linux_ownership_projection_latency.json docs/support/linux_public_surface_acceptance.json docs/support/linux_public_surface_latency.json docs/support/linux_api_availability_acceptance.json docs/support/linux_api_availability_latency.json docs/support/linux_module_spi_acceptance.json docs/support/linux_module_spi_latency.json docs/support/linux_source_graph_acceptance.json docs/support/linux_arc_assignment_acceptance.json docs/support/linux_managed_call_acceptance.json docs/support/linux_runtime_call_acceptance.json docs/support/linux_managed_typed_error_acceptance.json docs/support/linux_direct_dispatch_acceptance.json docs/support/linux_recursive_carrier_acceptance.json docs/support/linux_owned_capture_acceptance.json 'tests/clang_foundation/source_graph/**/*.json' 'tests/clang_foundation/ownership_projection/**/*.json' 'tests/clang_foundation/public_module_surface/**/*.json' 'tests/clang_foundation/api_availability/**/*.json' 'tests/clang_foundation/module_spi/**/*.json'
          uv run python -m scripts.objc3c_toolchain.generate_features --check
          uv run python -m scripts.objc3c_toolchain check-host-tools
          uv run python -m pytest -q tests/tooling/test_clang_feature_authority.py
