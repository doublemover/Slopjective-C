name: Conformance Evidence Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "schemas/**"
      - "reports/conformance/**"
      - "scripts/check_release_evidence.py"
      - "scripts/generate_conformance_evidence_index.py"
      - ".github/workflows/conformance-evidence-gate.yml"
  push:
    branches:
      - main
    paths:
      - "schemas/**"
      - "reports/conformance/**"
      - "scripts/check_release_evidence.py"
      - "scripts/generate_conformance_evidence_index.py"
      - ".github/workflows/conformance-evidence-gate.yml"

jobs:
  conformance-evidence-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15.0"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.0"

      - name: Install Python validator dependency
        run: |
          python -m pip install uv==0.13.1
          uv export --locked --only-group dev --format requirements-txt --output-file "${{ runner.temp }}/objc3-dev-requirements.txt"
          uv pip install --system --require-hashes --requirements "${{ runner.temp }}/objc3-dev-requirements.txt"

      - name: Install Node dependencies
        run: |
          npm install --global npm@12.2.1
          npm ci

      - name: Validate release evidence artifacts
        run: npm run objc3c -- check-release-evidence
