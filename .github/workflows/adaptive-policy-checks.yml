name: Adaptive CI policy checks

on:
  pull_request:
    paths:
      - ".github/ci/**"
      - ".github/actions/**"
      - ".github/workflows/**"
      - ".github/actionlint.yaml"
  push:
    branches: [main]
    paths:
      - ".github/ci/**"
      - ".github/actions/**"
      - ".github/workflows/**"
      - ".github/actionlint.yaml"

permissions:
  contents: read

concurrency:
  group: adaptive-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"
          cache: npm
      - name: Restore pinned workflow linter
        id: actionlint-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/objc3-actionlint
          key: actionlint-v1.7.12-linux-amd64-8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      - name: Locked workflow parser
        run: |
          npm install --global npm@12.2.2 --prefer-offline --no-audit --no-fund
          npm ci --ignore-scripts --prefer-offline --no-audit --no-fund
      - name: GitHub workflow syntax, expressions and shell
        shell: bash
        run: |
          set -euo pipefail
          root="$HOME/.cache/objc3-actionlint"
          binary="$root/actionlint"
          if [[ ! -x "$binary" ]]; then
            mkdir -p "$root/unpack"
            archive="$root/actionlint_1.7.12_linux_amd64.tar.gz"
            curl --fail --location --silent --show-error \
              --output "$archive" \
              https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
            echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check --strict
            tar -xzf "$archive" -C "$root/unpack"
            install -m 0755 "$root/unpack/actionlint" "$binary"
          fi
          shellcheck=$(command -v shellcheck)
          "$binary" -shellcheck "$shellcheck"
      - name: Publish pinned workflow linter
        if: steps.actionlint-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/objc3-actionlint
          key: actionlint-v1.7.12-linux-amd64-8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            execFileSync('node', ['--test', '.github/ci/adaptive-ci.test.mjs', '.github/ci/workflow-contract.test.mjs'], { stdio: 'inherit' });
            const { validateConfig } = await import(process.env.GITHUB_WORKSPACE + '/.github/ci/adaptive-ci.mjs');
            validateConfig(JSON.parse(require('node:fs').readFileSync('.github/ci/adaptive-ci.json', 'utf8')));
            execFileSync('node', ['.github/ci/workflow-contract.mjs'], { stdio: 'inherit' });
