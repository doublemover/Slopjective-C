name: Planning Lint (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  planning-publication-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: npm ci

      - name: Check planning publication drift
        run: npm run objc3c -- check-planning-publication-drift
