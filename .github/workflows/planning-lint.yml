name: Planning Lint (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  planning-publication-drift:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"
          cache: npm

      - name: Reuse the pinned Python and CMake dependencies
        uses: ./.github/actions/python-tools

      - name: Install Node dependencies
        run: |
          npm install --global npm@12.2.2 --prefer-offline --no-audit --no-fund
          npm ci --prefer-offline --no-audit --no-fund

      - name: Check planning publication drift
        run: uv run python -m scripts.objc3c_workflow check-planning-publication-drift
