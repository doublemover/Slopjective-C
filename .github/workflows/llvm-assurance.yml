name: Linux LLVM IR and optimized debugger assurance
on:
  pull_request:
    paths:
      - .github/workflows/llvm-assurance.yml
      - scripts/objc3c_toolchain/llvm_*.py
      - scripts/objc3c_toolchain/compiler_instrumentation.py
      - scripts/objc3c_toolchain/sanitizer_policy.py
      - toolchains/llvm/**
      - native/objc3c/**
      - stdlib/**
      - tests/clang_foundation/**
      - tests/tooling/fixtures/llvm_assurance/**
      - tests/tooling/fixtures/native_sanitizer_controls/**
      - tests/tooling/fixtures/native_container/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-llvm-assurance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  llvm-assurance:
    name: Execute matched LLVM IR and optimized debug controls
    runs-on: ubuntu-26.04
    container:
      image: debian:13
      options: --security-opt seccomp=unconfined
    timeout-minutes: 360
    env:
      OBJC3C_CLOUD_SETUP_ROOT: /opt/objc3c-host
    steps:
      - name: Development prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git curl ca-certificates python3 python3-venv xz-utils zstd g++ zlib1g-dev libzstd-dev libssl-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pinned host tools
        shell: bash
        run: python3 -B -m scripts.objc3c_assurance.bootstrap --root /opt/objc3c-host --output out/llvm-startup
      - name: Require sanitizer process layout support
        run: |
          mkdir -p out
          g++ tests/tooling/fixtures/native_container/personality.c -o out/native-container-control
          out/native-container-control
      - name: Execute real IR, reduction and optimized debugger campaign
        shell: bash
        run: |
          source /opt/objc3c-host/activate.sh
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          export OBJC3C_BOOTSTRAP_LLVM_ROOT=/opt/objc3c-host/llvm-23.1.3
          ulimit -c 0
          python3 -B -m scripts.objc3c_toolchain.llvm_campaign --fetch --output out/llvm-assurance
      - name: Retain LLVM diagnostics and reproducible inputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: llvm-assurance-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/llvm-startup/
            out/llvm-assurance/**/*.json
            out/llvm-assurance/**/*.log
            out/llvm-assurance/**/*.ll
            out/llvm-assurance/**/*.bc
            out/llvm-assurance/**/*.mir
            out/llvm-assurance/**/*.s
            out/llvm-assurance/**/*.sh
            out/llvm-assurance/**/*.pch
            out/llvm-assurance/**/*.objc3i
            out/llvm-assurance/**/*.m
            out/llvm-assurance/**/*.mm
            out/llvm-assurance/**/*.cpp
            out/llvm-assurance/**/*.h
            out/llvm-assurance/**/*.hpp
          if-no-files-found: error
          retention-days: 7
