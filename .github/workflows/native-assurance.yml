name: Extended Linux native assurance
run-name: ${{ inputs.diagnostic_core_only && 'Linux core diagnosis (partial surface)' || 'Extended Linux native assurance' }}
on:
  schedule:
    - cron: "37 5 * * 0"
  workflow_dispatch:
    inputs:
      diagnostic_core_only:
        description: Diagnose the core frontend only; no full gate or SDK publication
        type: boolean
        default: false
      diagnostic_transport_run:
        description: Split an existing diagnostic artifact for download; requires core-only mode
        type: string
        default: ''
      diagnostic_transport_artifact:
        description: Exact artifact name from diagnostic_transport_run
        type: string
        default: ''
  workflow_call:
permissions:
  contents: read
  actions: read
concurrency:
  group: linux-native-assurance-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}${{ inputs.diagnostic_core_only && '-core-diagnosis' || '' }}
  # Preserve active builds without letting an older coverage owner hold a
  # repaired source revision. Duplicate requests for the same source serialize.
  cancel-in-progress: false
jobs:
  diagnostic-transport:
    name: Split existing artifact for bounded download (no compiler execution)
    if: inputs.diagnostic_core_only && inputs.diagnostic_transport_run != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.diagnostic_transport_artifact }}
          run-id: ${{ inputs.diagnostic_transport_run }}
          github-token: ${{ github.token }}
          path: out/diagnostic-transport/input
      - name: Report retained failure diagnostics
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path('out/diagnostic-transport/input')
          rows = []
          failed_logs = []

          def commands(value):
              if isinstance(value, dict):
                  if value.get('log') and (value.get('exit_code') not in (None, 0) or
                                           value.get('timed_out') is True):
                      yield value
                  for child in value.values():
                      yield from commands(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from commands(child)

          for path in sorted(root.rglob('*.json')):
              try:
                  value = json.loads(path.read_text())
              except (OSError, ValueError):
                  continue
              if not isinstance(value, dict):
                  continue
              errors = [value.get(name) for name in ('error', 'diagnostic_error')
                        if value.get(name)]
              errors.extend(value.get('cleanup_errors') or [])
              if value.get('status') in ('FAIL', 'failed') or errors:
                  rows.append((path.as_posix(), value.get('status'),
                               [str(error)[:1200] for error in errors]))
              for command in commands(value):
                  original = Path(str(command['log']))
                  candidates = ([path.parent / original] if not original.is_absolute() else [])
                  candidates.extend(root.rglob(original.name))
                  log = next((candidate for candidate in candidates if candidate.is_file()), None)
                  if log and log not in failed_logs:
                      failed_logs.append(log)
          if not rows:
              rows.append(('<artifact>', 'no-failure-record',
                           ['retained artifact contains no structured failure record']))
          for log in sorted(root.rglob('*.log')):
              if any(part.endswith('-failure') for part in log.parts) and log not in failed_logs:
                  failed_logs.append(log)
          for path, status, errors in rows[:20]:
              message = json.dumps({'path': path, 'status': status, 'errors': errors},
                                   sort_keys=True)
              escaped = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Retained assurance diagnostic::' + escaped)
          receipt_names = {'release.json', 'foundation.json', 'installation-cost.json'}
          receipts = [{'path': path.as_posix(), 'bytes': path.lstat().st_size,
                       'symlink': path.is_symlink(), 'regular': path.is_file()}
                      for path in sorted(root.rglob('*')) if path.name in receipt_names]
          if receipts:
              message = json.dumps({'operational_receipts': receipts[:40]}, sort_keys=True)
              escaped = message[-5000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::notice title=Retained operational receipt inventory::' + escaped)
          for log in failed_logs[:20]:
              lines = [line for line in log.read_text(errors='replace').splitlines() if line.strip()]
              pattern = re.compile(r'(^|[^A-Z])(CASE|PASS|FAIL)([^A-Z]|$)|assert|error:|fatal|signal|sanitizer|timed? ?out', re.I)
              relevant = [line[:1000] for line in lines if pattern.search(line)]
              message = json.dumps({'log': log.as_posix(), 'relevant': relevant[-80:],
                                    'tail': lines[-20:]}, sort_keys=True)
              escaped = message[-5000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Failed native command log::' + escaped)
          PY
      - name: Retain exact payload hashes and split bounded parts
        env:
          SOURCE_RUN: ${{ inputs.diagnostic_transport_run }}
          SOURCE_ARTIFACT: ${{ inputs.diagnostic_transport_artifact }}
        run: >-
          python3 -B -m scripts.objc3c_toolchain.artifact_transport
          --source out/diagnostic-transport/input --output out/diagnostic-transport/parts
          --source-run "$SOURCE_RUN" --source-artifact "$SOURCE_ARTIFACT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostic-download-${{ github.run_id }}-part0
          path: |
            out/diagnostic-transport/parts/payload.part0
            out/diagnostic-transport/parts/manifest.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostic-download-${{ github.run_id }}-part1
          path: |
            out/diagnostic-transport/parts/payload.part1
            out/diagnostic-transport/parts/manifest.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostic-download-${{ github.run_id }}-part2
          path: |
            out/diagnostic-transport/parts/payload.part2
            out/diagnostic-transport/parts/manifest.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostic-download-${{ github.run_id }}-part3
          path: |
            out/diagnostic-transport/parts/payload.part3
            out/diagnostic-transport/parts/manifest.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
  plan:
    name: Classify exact source revision
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      native: ${{ steps.plan.outputs.native }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        shell: bash
        run: |
          periodic=()
          if [[ "$GITHUB_EVENT_NAME" == schedule || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            periodic=(--periodic-sha "$GITHUB_SHA")
          fi
          python3 -B -m scripts.objc3c_assurance plan --plan out/native-assurance/plan.json "${periodic[@]}"
      - name: Preserve source classification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-plan-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/native-assurance/plan.json
          if-no-files-found: error
          retention-days: 7
  diagnostic-native:
    name: Diagnose Linux compiler core
    needs: plan
    if: needs.plan.outputs.native == 'true' && inputs.diagnostic_core_only && inputs.diagnostic_transport_run == ''
    runs-on: ubuntu-26.04
    container:
      image: debian:13
      options: --security-opt seccomp=unconfined
    timeout-minutes: 360
    env:
      OBJC3C_CLOUD_SETUP_ROOT: /opt/objc3c-host
    steps:
      - name: Development prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git curl ca-certificates gnupg python3 python3-venv xz-utils zstd g++ zlib1g-dev libzstd-dev libssl-dev libxml2 libcurl4 libedit2 libsqlite3-0 libncurses6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-plan-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/native-assurance/selection
      - uses: ./.github/actions/linux-host-tools
        with:
          output: out/native-assurance/startup
          include_swift: true
      - name: Require sanitizer process layout support
        run: |
          mkdir -p out
          g++ tests/tooling/fixtures/native_container/personality.c -o out/native-container-control
          out/native-container-control
      - name: Execute diagnostic core
        shell: bash
        run: |
          source /opt/objc3c-host/activate.sh
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          export OBJC3C_BOOTSTRAP_LLVM_ROOT=/opt/objc3c-host/llvm-23.1.5
          ulimit -c 0
          periodic=()
          if [[ "$GITHUB_EVENT_NAME" == schedule || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            periodic=(--periodic-sha "$GITHUB_SHA")
          fi
          python3 -B -m scripts.objc3c_assurance run --plan out/native-assurance/selection/plan.json --output out/native-assurance/results --shard core "${periodic[@]}"

  product-producer:
    name: Build and seal exact Linux SDK producer
    needs: plan
    if: needs.plan.outputs.native == 'true' && !inputs.diagnostic_core_only && inputs.diagnostic_transport_run == ''
    runs-on: ubuntu-26.04
    container:
      image: debian:13
      options: --security-opt seccomp=unconfined
    timeout-minutes: 360
    env:
      OBJC3C_CLOUD_SETUP_ROOT: /opt/objc3c-host
    steps:
      - name: Development prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git curl ca-certificates gnupg python3 python3-venv xz-utils zstd g++ zlib1g-dev libzstd-dev libssl-dev libxml2 libcurl4 libedit2 libsqlite3-0 libncurses6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-plan-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/native-assurance/selection
      - uses: ./.github/actions/linux-host-tools
        with:
          output: out/native-assurance/startup/product-producer
      - name: Require sanitizer process layout support
        run: |
          mkdir -p out
          g++ tests/tooling/fixtures/native_container/personality.c -o out/native-container-control
          out/native-container-control
      - name: Build, qualify and seal the exact SDK
        shell: bash
        run: |
          source /opt/objc3c-host/activate.sh
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          export OBJC3C_BOOTSTRAP_LLVM_ROOT=/opt/objc3c-host/llvm-23.1.5
          ulimit -c 0
          python3 -B -m scripts.objc3c_assurance.release_matrix run \
            --plan out/native-assurance/selection/plan.json \
            --output out/release-matrix/results/product-producer \
            --group product-producer
      - name: Preserve qualified SDK archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: objc3c-linux-sdk
          path: |
            out/toolchains/sdk-cache/*.tar.zst
            out/toolchains/sdk-cache/*.tar.json
            scripts/install_objc3c_linux.sh
            scripts/objc3c_toolchain/install_sdk.py
            scripts/qualify_linux_archive.sh
          if-no-files-found: error
          retention-days: 7
      - name: Preserve producer evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-partial-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-product-producer
          path: |
            out/release-matrix/results/
            !out/release-matrix/results/**/build/**
            !out/release-matrix/results/**/isolated-install/**
          if-no-files-found: error
          retention-days: 7

  product-consumers:
    name: Qualify exact SDK consumer (${{ matrix.group }})
    needs: [plan, product-producer]
    if: needs.plan.outputs.native == 'true' && needs.product-producer.result == 'success' && !inputs.diagnostic_core_only
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: foundation
            swift: false
          - group: runtime
            swift: false
          - group: frontend
            swift: false
          - group: installed-sanitizers
            swift: false
          - group: swift
            swift: true
          - group: semantic
            swift: false
          - group: asan-products
            swift: false
    runs-on: ubuntu-26.04
    container:
      image: debian:13
      options: --security-opt seccomp=unconfined
    timeout-minutes: 360
    env:
      OBJC3C_CLOUD_SETUP_ROOT: /opt/objc3c-host
      RELEASE_GROUP: ${{ matrix.group }}
    steps:
      - name: Development prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git curl ca-certificates gnupg python3 python3-venv xz-utils zstd g++ zlib1g-dev libzstd-dev libssl-dev libxml2 libcurl4 libedit2 libsqlite3-0 libncurses6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-plan-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/native-assurance/selection
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: objc3c-linux-sdk
          path: /release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-partial-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-product-producer
          path: /producer
      - uses: ./.github/actions/linux-host-tools
        with:
          output: out/native-assurance/startup/${{ matrix.group }}
          include_swift: ${{ matrix.swift }}
      - name: Install the exact producer archive
        shell: bash
        run: |
          archive=$(find /release -name '*.tar.zst' -type f)
          expected=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["archive_sha256"])' /producer/product-producer/package/release.json)
          sh /release/scripts/install_objc3c_linux.sh --archive "$archive" --sha256 "$expected" --root /opt/objc3c-product
      - name: Require sanitizer process layout support
        run: |
          mkdir -p out
          g++ tests/tooling/fixtures/native_container/personality.c -o out/native-container-control
          out/native-container-control
      - name: Execute selected product consumers
        shell: bash
        run: |
          source /opt/objc3c-host/activate.sh
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          export OBJC3C_BOOTSTRAP_LLVM_ROOT=/opt/objc3c-host/llvm-23.1.5
          ulimit -c 0
          python3 -B -m scripts.objc3c_assurance.release_matrix run \
            --plan out/native-assurance/selection/plan.json \
            --output "out/release-matrix/results/$RELEASE_GROUP" \
            --group "$RELEASE_GROUP" \
            --product-sdk /opt/objc3c-product/current \
            --package-release /producer/product-producer/package/release.json
      - name: Preserve consumer evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-partial-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.group }}
          path: |
            out/release-matrix/results/
            !out/release-matrix/results/**/build/**
            !out/release-matrix/results/**/isolated-install/**
          if-no-files-found: error
          retention-days: 7

  independent-native:
    name: Execute independent native owner (frontend-fuzz)
    needs: plan
    if: needs.plan.outputs.native == 'true' && !inputs.diagnostic_core_only && inputs.diagnostic_transport_run == ''
    runs-on: ubuntu-26.04
    container:
      image: debian:13
      options: --security-opt seccomp=unconfined
    timeout-minutes: 360
    env:
      OBJC3C_CLOUD_SETUP_ROOT: /opt/objc3c-host
    steps:
      - name: Development prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git curl ca-certificates gnupg python3 python3-venv xz-utils zstd g++ zlib1g-dev libzstd-dev libssl-dev libxml2 libcurl4 libedit2 libsqlite3-0 libncurses6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-plan-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/native-assurance/selection
      - uses: ./.github/actions/linux-host-tools
        with:
          output: out/native-assurance/startup/frontend-fuzz
      - name: Execute fuzz owner
        shell: bash
        run: |
          source /opt/objc3c-host/activate.sh
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          export OBJC3C_BOOTSTRAP_LLVM_ROOT=/opt/objc3c-host/llvm-23.1.5
          ulimit -c 0
          periodic=()
          if [[ "$GITHUB_EVENT_NAME" == schedule || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            periodic=(--periodic-sha "$GITHUB_SHA")
          fi
          python3 -B -m scripts.objc3c_assurance run \
            --plan out/native-assurance/selection/plan.json \
            --output out/native-assurance/results --shard frontend-fuzz "${periodic[@]}"
      - name: Stage fuzz evidence
        shell: bash
        run: |
          periodic=()
          if [[ "$GITHUB_EVENT_NAME" == schedule || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            periodic=(--periodic-sha "$GITHUB_SHA")
          fi
          python3 -B -m scripts.objc3c_assurance publish \
            --plan out/native-assurance/selection/plan.json \
            --output out/native-assurance/results --shard frontend-fuzz \
            --destination out/native-assurance/evidence/frontend-fuzz "${periodic[@]}"
      - name: Preserve fuzz evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-results-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-frontend-fuzz
          path: out/native-assurance/evidence/
          if-no-files-found: error
          retention-days: 7

  coverage-producer:
    name: Build exact source-coverage compiler producer
    needs: plan
    if: needs.plan.outputs.native == 'true' && !inputs.diagnostic_core_only && inputs.diagnostic_transport_run == ''
    runs-on: ubuntu-26.04
    container:
      image: debian:13
      options: --security-opt seccomp=unconfined
    timeout-minutes: 360
    env:
      OBJC3C_CLOUD_SETUP_ROOT: /opt/objc3c-host
    steps:
      - name: Development prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git curl ca-certificates gnupg python3 python3-venv xz-utils zstd g++ zlib1g-dev libzstd-dev libssl-dev libxml2 libcurl4 libedit2 libsqlite3-0 libncurses6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-plan-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/native-assurance/selection
      - uses: ./.github/actions/linux-host-tools
        with:
          output: out/native-assurance/startup/coverage-producer
      - name: Build profile and qualify compiler-owned coverage
        shell: bash
        run: |
          source /opt/objc3c-host/activate.sh
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          export OBJC3C_BOOTSTRAP_LLVM_ROOT=/opt/objc3c-host/llvm-23.1.5
          ulimit -c 0
          python3 -B -m scripts.objc3c_assurance.coverage_matrix produce \
            --plan out/native-assurance/selection/plan.json \
            --output out/coverage-matrix/producer \
            --bundle out/coverage-matrix/profile.tar.zst
      - name: Preserve exact coverage profile bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-profile-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/coverage-matrix/profile.tar.zst
            out/coverage-matrix/producer/producer.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Preserve producer coverage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-producer-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/coverage-matrix/producer/
          if-no-files-found: error
          retention-days: 7

  coverage-partitions:
    name: Execute first-party source coverage (partition ${{ matrix.partition }})
    needs: [plan, coverage-producer]
    if: needs.plan.outputs.native == 'true' && needs.coverage-producer.result == 'success' && !inputs.diagnostic_core_only
    strategy:
      fail-fast: false
      matrix:
        partition: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-26.04
    container:
      image: debian:13
      options: --security-opt seccomp=unconfined
    timeout-minutes: 180
    env:
      OBJC3C_CLOUD_SETUP_ROOT: /opt/objc3c-host
      COVERAGE_PARTITION: ${{ matrix.partition }}
    steps:
      - name: Development prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git curl ca-certificates gnupg python3 python3-venv xz-utils zstd g++ zlib1g-dev libzstd-dev libssl-dev libxml2 libcurl4 libedit2 libsqlite3-0 libncurses6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-plan-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/native-assurance/selection
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-profile-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/coverage-matrix/profile
      - uses: ./.github/actions/linux-host-tools
        with:
          output: out/native-assurance/startup/coverage-${{ matrix.partition }}
      - name: Execute exact first-party coverage partition
        shell: bash
        run: |
          source /opt/objc3c-host/activate.sh
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          export OBJC3C_BOOTSTRAP_LLVM_ROOT=/opt/objc3c-host/llvm-23.1.5
          ulimit -c 0
          python3 -B -m scripts.objc3c_assurance.coverage_matrix partition \
            --plan out/native-assurance/selection/plan.json \
            --producer out/coverage-matrix/profile/producer/producer.json \
            --bundle out/coverage-matrix/profile/profile.tar.zst \
            --output "out/coverage-matrix/partitions/$COVERAGE_PARTITION" \
            --index "$COVERAGE_PARTITION"
      - name: Preserve coverage partition evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-partition-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.partition }}
          path: out/coverage-matrix/partitions/
          if-no-files-found: error
          retention-days: 7

  core-aggregate:
    name: Merge exact SDK consumer evidence
    needs: [plan, product-producer, product-consumers]
    if: always() && !inputs.diagnostic_core_only && needs.plan.result == 'success' && needs.product-producer.result == 'success' && needs.product-consumers.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-plan-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/native-assurance/selection
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-partial-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-*
          merge-multiple: true
          path: out/release-matrix/partials
      - name: Prove complete disjoint core union
        run: |
          python3 -B -m scripts.objc3c_assurance.release_matrix aggregate \
            --plan out/native-assurance/selection/plan.json \
            --partials out/release-matrix/partials \
            --output out/native-assurance/results
          periodic=()
          if [[ "$GITHUB_EVENT_NAME" == schedule || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            periodic=(--periodic-sha "$GITHUB_SHA")
          fi
          python3 -B -m scripts.objc3c_assurance publish \
            --plan out/native-assurance/selection/plan.json \
            --output out/native-assurance/results --shard core \
            --destination out/native-assurance/evidence/core "${periodic[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-results-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-core
          path: out/native-assurance/evidence/
          if-no-files-found: error
          retention-days: 7

  coverage-aggregate:
    name: Merge all source-coverage partitions
    needs: [plan, coverage-producer, coverage-partitions]
    if: always() && !inputs.diagnostic_core_only && needs.plan.result == 'success' && needs.coverage-producer.result == 'success' && needs.coverage-partitions.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-plan-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/native-assurance/selection
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-producer-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/coverage-matrix/producer-result
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-partition-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-*
          merge-multiple: true
          path: out/coverage-matrix/partitions
      - name: Prove complete disjoint coverage union
        run: |
          python3 -B -m scripts.objc3c_assurance.coverage_matrix aggregate \
            --plan out/native-assurance/selection/plan.json \
            --producer-root out/coverage-matrix/producer-result \
            --partitions-root out/coverage-matrix/partitions \
            --output out/native-assurance/results
          periodic=()
          if [[ "$GITHUB_EVENT_NAME" == schedule || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            periodic=(--periodic-sha "$GITHUB_SHA")
          fi
          python3 -B -m scripts.objc3c_assurance publish \
            --plan out/native-assurance/selection/plan.json \
            --output out/native-assurance/results --shard source-coverage \
            --destination out/native-assurance/evidence/source-coverage "${periodic[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-results-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-source-coverage
          path: out/native-assurance/evidence/
          if-no-files-found: error
          retention-days: 7

  gate:
    name: Extended Linux native assurance gate
    if: always() && !inputs.diagnostic_core_only
    needs: [plan, product-producer, product-consumers, independent-native, coverage-producer, coverage-partitions, core-aggregate, coverage-aggregate]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-plan-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-results-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-*
          merge-multiple: true
          path: evidence/results
      - name: Require exact-revision complete passing results
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          PRODUCER_RESULT: ${{ needs.product-producer.result }}
          CONSUMERS_RESULT: ${{ needs.product-consumers.result }}
          FUZZ_RESULT: ${{ needs.independent-native.result }}
          COVERAGE_PRODUCER_RESULT: ${{ needs.coverage-producer.result }}
          COVERAGE_PARTITIONS_RESULT: ${{ needs.coverage-partitions.result }}
          CORE_RESULT: ${{ needs.core-aggregate.result }}
          COVERAGE_RESULT: ${{ needs.coverage-aggregate.result }}
        shell: bash
        run: |
          for result in "$PRODUCER_RESULT" "$CONSUMERS_RESULT" "$FUZZ_RESULT" "$COVERAGE_PRODUCER_RESULT" "$COVERAGE_PARTITIONS_RESULT" "$CORE_RESULT" "$COVERAGE_RESULT"; do
            [[ "$result" == success ]]
          done
          export ASSURANCE_OUTCOMES="{\"plan\":\"$PLAN_RESULT\",\"native\":\"success\"}"
          periodic=()
          if [[ "$GITHUB_EVENT_NAME" == schedule || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            periodic=(--periodic-sha "$GITHUB_SHA")
          fi
          python3 -B -m scripts.objc3c_assurance verify --sharded --plan evidence/plan/plan.json --output evidence/results "${periodic[@]}"
