name: Linux native assurance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: linux-native-assurance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    name: Classify exact source revision
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      native: ${{ steps.plan.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        run: python3 -B -m scripts.objc3c_assurance plan --plan out/native-assurance/plan.json
      - name: Preserve source classification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-plan-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/native-assurance/plan.json
          if-no-files-found: error
          retention-days: 7
  native:
    name: Execute Linux compiler and runtime
    needs: plan
    if: needs.plan.outputs.native == 'true'
    runs-on: ubuntu-26.04
    container: debian:13
    timeout-minutes: 360
    env:
      OBJC3C_CLOUD_SETUP_ROOT: /opt/objc3c-host
    steps:
      - name: Development prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git curl ca-certificates python3 python3-venv xz-utils zstd g++ zlib1g-dev libzstd-dev libssl-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-plan-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/native-assurance/selection
      - name: Pinned host tools
        shell: bash
        run: bash scripts/setup_cloud_environment.sh
      - name: Build and execute selected native surface
        shell: bash
        run: |
          source /opt/objc3c-host/activate.sh
          export OBJC3C_BOOTSTRAP_LLVM_ROOT=/opt/objc3c-host/llvm-23.1.3
          ulimit -c 0
          python3 -B -m scripts.objc3c_assurance run --plan out/native-assurance/selection/plan.json --output out/native-assurance/results
      - name: Preserve native evidence on success and failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-results-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/native-assurance/results/**/*.json
            out/native-assurance/results/**/*.xml
            out/native-assurance/results/**/*.log
            !out/native-assurance/results/**/build/**
            !out/native-assurance/results/**/isolated-install/**
          if-no-files-found: error
          retention-days: 7
  gate:
    name: Linux native assurance gate
    if: always()
    needs: [plan, native]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read required source classification
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-plan-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/plan
      - name: Read required native evidence
        if: needs.plan.outputs.native == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-results-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/results
      - name: Require exact-revision complete passing results
        env:
          ASSURANCE_OUTCOMES: '{"plan":"${{ needs.plan.result }}","native":"${{ needs.native.result }}"}'
        run: python3 -B -m scripts.objc3c_assurance verify --plan evidence/plan/plan.json --output evidence/results
