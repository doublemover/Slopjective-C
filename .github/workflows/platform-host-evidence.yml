name: Linux SDK release qualification
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: linux-sdk-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  implementation-analysis:
    name: Fork-matched implementation release gate
    uses: ./.github/workflows/implementation-analysis.yml
    with:
      source_sha: ${{ github.sha }}
  build:
    name: Current native qualification and SDK archive
    uses: ./.github/workflows/native-assurance.yml
  install:
    needs: [build, implementation-analysis]
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        distribution: ["debian:13", "ubuntu:26.04"]
    container:
      image: ${{ matrix.distribution }}
      options: --security-opt seccomp=unconfined
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: objc3c-linux-sdk
          path: /release
      - name: Install, relocate, build, embed, debug and run the shipped archive
        shell: sh
        run: |
          archive=$(find /release -name '*.tar.zst')
          receipt=$(find /release -name '*.tar.json')
          expected_sha=$(sed -n 's/ *"archive_sha256": "\([a-f0-9]*\)".*/\1/p' "$receipt")
          sh /release/scripts/qualify_linux_archive.sh "$archive" "$expected_sha" /opt/objc3c
