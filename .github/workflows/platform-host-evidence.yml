name: Linux SDK release qualification
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  # A completed native build must not hold a repaired revision behind an older
  # analysis job. Each release still builds and checks its own exact revision.
  group: linux-sdk-release-${{ github.sha }}
  cancel-in-progress: false
jobs:
  implementation-analysis:
    name: Fork-matched implementation release gate
    uses: ./.github/workflows/implementation-analysis.yml
    with:
      source_sha: ${{ github.sha }}
  build:
    name: Current native qualification and SDK archive
    uses: ./.github/workflows/native-assurance.yml
  install:
    needs: [build, implementation-analysis]
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        distribution: ["debian:13", "ubuntu:26.04"]
    container:
      image: ${{ matrix.distribution }}
      options: --security-opt seccomp=unconfined
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: objc3c-linux-sdk
          path: /release
      - name: Install, relocate, build, embed, debug and run the shipped archive
        shell: sh
        run: |
          archive_count=$(find /release -name '*.tar.zst' -type f | wc -l)
          receipt_count=$(find /release -name '*.tar.json' -type f | wc -l)
          [ "$archive_count" -eq 1 ] && [ "$receipt_count" -eq 1 ] || {
            echo "expected one archive and one receipt; found $archive_count and $receipt_count" >&2
            exit 1
          }
          archive=$(find /release -name '*.tar.zst' -type f)
          receipt=$(find /release -name '*.tar.json' -type f)
          expected_sha=$(sed -n 's/ *"archive_sha256": "\([a-f0-9]*\)".*/\1/p' "$receipt")
          [ "${#expected_sha}" -eq 64 ] || { echo 'archive receipt has no SHA-256' >&2; exit 1; }
          sh /release/scripts/qualify_linux_archive.sh "$archive" "$expected_sha" /opt/objc3c
