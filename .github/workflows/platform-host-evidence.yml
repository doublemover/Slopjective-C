name: ObjC3C Platform Host Evidence

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform evidence job to run
        required: true
        default: all
        type: choice
        options:
          - all
          - linux-x64
          - darwin-arm64

permissions:
  contents: read

concurrency:
  group: platform-host-evidence-${{ github.workflow }}-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: true

jobs:
  linux-x64:
    if: inputs.platform == 'all' || inputs.platform == 'linux-x64'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OBJC3C_PLATFORM_ID: linux-x64
      OBJC3C_PLATFORM_RUNNER_LABEL: ubuntu-24.04
      OBJC3C_PLATFORM_EVIDENCE_ROOT: tmp/reports/platform-host-evidence/linux-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install host toolchain prerequisites
        id: toolchain
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm llvm-dev cmake ninja-build

      - name: Install workflow dependencies
        id: deps
        continue-on-error: true
        run: |
          python -m pip install --upgrade jsonschema
          npm ci

      - name: Probe hosted LLVM capabilities
        id: probe
        continue-on-error: true
        run: |
          python scripts/probe_objc3c_llvm_capabilities.py --summary-out "$OBJC3C_PLATFORM_EVIDENCE_ROOT/llvm-capabilities.json"
          mkdir -p tmp/artifacts/objc3c-native/m144/llvm_capabilities
          cp "$OBJC3C_PLATFORM_EVIDENCE_ROOT/llvm-capabilities.json" tmp/artifacts/objc3c-native/m144/llvm_capabilities/summary.json

      - name: Build native objc3c artifacts
        id: build
        continue-on-error: true
        run: npm run objc3c -- build-native-binaries

      - name: Package runnable toolchain
        id: package
        continue-on-error: true
        run: npm run objc3c -- package-runnable-toolchain

      - name: Validate package install path
        id: install
        continue-on-error: true
        run: npm run objc3c -- validate-packaging-channels-end-to-end

      - name: Run hosted native execution smoke
        id: execution
        continue-on-error: true
        run: npm run objc3c -- test-hosted-execution-smoke

      - name: Ingest generated host evidence without promotion
        if: always()
        env:
          OBJC3C_PLATFORM_EVIDENCE_DEPENDENCY_OUTCOME: ${{ steps.deps.outcome }}
          OBJC3C_PLATFORM_EVIDENCE_TOOLCHAIN_SETUP_OUTCOME: ${{ steps.toolchain.outcome }}
          OBJC3C_PLATFORM_EVIDENCE_TOOLCHAIN_PROBE_OUTCOME: ${{ steps.probe.outcome }}
          OBJC3C_PLATFORM_EVIDENCE_BUILD_OUTCOME: ${{ steps.build.outcome }}
          OBJC3C_PLATFORM_EVIDENCE_PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          OBJC3C_PLATFORM_EVIDENCE_INSTALL_OUTCOME: ${{ steps.install.outcome }}
          OBJC3C_PLATFORM_EVIDENCE_EXECUTION_OUTCOME: ${{ steps.execution.outcome }}
        run: >
          python scripts/ingest_objc3c_platform_host_evidence.py
          --platform-id "$OBJC3C_PLATFORM_ID"
          --runner-label "$OBJC3C_PLATFORM_RUNNER_LABEL"
          --workflow-path ".github/workflows/platform-host-evidence.yml"
          --report-out "$OBJC3C_PLATFORM_EVIDENCE_ROOT/host-evidence-report.json"
          --summary-out "$OBJC3C_PLATFORM_EVIDENCE_ROOT/ingestion-summary.json"

      - name: Upload generated host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: objc3c-platform-host-evidence-linux-x64
          path: |
            tmp/reports/platform-host-evidence/linux-x64/**
            tmp/build-objc3c-native/native_build_summary.json
            artifacts/package/objc3c-runnable-toolchain-package.json
            tmp/reports/package-channels/end-to-end-summary.json
            tmp/reports/hosted-execution-smoke/summary.json
            tmp/reports/objc3c-native-execution-smoke/summary.json
          if-no-files-found: warn

  darwin-arm64:
    if: inputs.platform == 'all' || inputs.platform == 'darwin-arm64'
    runs-on: macos-15
    timeout-minutes: 120
    env:
      OBJC3C_PLATFORM_ID: darwin-arm64
      OBJC3C_PLATFORM_RUNNER_LABEL: macos-15
      OBJC3C_PLATFORM_EVIDENCE_ROOT: tmp/reports/platform-host-evidence/darwin-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install host toolchain prerequisites
        id: toolchain
        continue-on-error: true
        run: |
          brew update
          brew install llvm cmake ninja
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "LLVM_ROOT=$(brew --prefix llvm)" >> "$GITHUB_ENV"

      - name: Install workflow dependencies
        id: deps
        continue-on-error: true
        run: |
          python -m pip install --upgrade jsonschema
          npm ci

      - name: Probe hosted LLVM capabilities
        id: probe
        continue-on-error: true
        run: |
          python scripts/probe_objc3c_llvm_capabilities.py --summary-out "$OBJC3C_PLATFORM_EVIDENCE_ROOT/llvm-capabilities.json"
          mkdir -p tmp/artifacts/objc3c-native/m144/llvm_capabilities
          cp "$OBJC3C_PLATFORM_EVIDENCE_ROOT/llvm-capabilities.json" tmp/artifacts/objc3c-native/m144/llvm_capabilities/summary.json

      - name: Build native objc3c artifacts
        id: build
        continue-on-error: true
        run: npm run objc3c -- build-native-binaries

      - name: Package runnable toolchain
        id: package
        continue-on-error: true
        run: npm run objc3c -- package-runnable-toolchain

      - name: Validate package install path
        id: install
        continue-on-error: true
        run: npm run objc3c -- validate-packaging-channels-end-to-end

      - name: Run hosted native execution smoke
        id: execution
        continue-on-error: true
        run: npm run objc3c -- test-hosted-execution-smoke

      - name: Ingest generated host evidence without promotion
        if: always()
        env:
          OBJC3C_PLATFORM_EVIDENCE_DEPENDENCY_OUTCOME: ${{ steps.deps.outcome }}
          OBJC3C_PLATFORM_EVIDENCE_TOOLCHAIN_SETUP_OUTCOME: ${{ steps.toolchain.outcome }}
          OBJC3C_PLATFORM_EVIDENCE_TOOLCHAIN_PROBE_OUTCOME: ${{ steps.probe.outcome }}
          OBJC3C_PLATFORM_EVIDENCE_BUILD_OUTCOME: ${{ steps.build.outcome }}
          OBJC3C_PLATFORM_EVIDENCE_PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          OBJC3C_PLATFORM_EVIDENCE_INSTALL_OUTCOME: ${{ steps.install.outcome }}
          OBJC3C_PLATFORM_EVIDENCE_EXECUTION_OUTCOME: ${{ steps.execution.outcome }}
        run: >
          python scripts/ingest_objc3c_platform_host_evidence.py
          --platform-id "$OBJC3C_PLATFORM_ID"
          --runner-label "$OBJC3C_PLATFORM_RUNNER_LABEL"
          --workflow-path ".github/workflows/platform-host-evidence.yml"
          --report-out "$OBJC3C_PLATFORM_EVIDENCE_ROOT/host-evidence-report.json"
          --summary-out "$OBJC3C_PLATFORM_EVIDENCE_ROOT/ingestion-summary.json"

      - name: Upload generated host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: objc3c-platform-host-evidence-darwin-arm64
          path: |
            tmp/reports/platform-host-evidence/darwin-arm64/**
            tmp/build-objc3c-native/native_build_summary.json
            artifacts/package/objc3c-runnable-toolchain-package.json
            tmp/reports/package-channels/end-to-end-summary.json
            tmp/reports/hosted-execution-smoke/summary.json
            tmp/reports/objc3c-native-execution-smoke/summary.json
          if-no-files-found: warn
