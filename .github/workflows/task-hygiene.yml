name: ObjC3C Core CI

on:
  pull_request:
    paths:
      - ".github/workflows/task-hygiene.yml"
      - ".npmrc"
      - "package.json"
      - "package-lock.json"
      - ".node-version"
      - ".python-version"
      - "pyproject.toml"
      - "uv.lock"
      - "toolchains/llvm/**"
      - "schemas/objc3-language-capabilities.json"
      - "native/**"
      - "scripts/**"
      - "tests/tooling/**"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/task-hygiene.yml"
      - ".npmrc"
      - "package.json"
      - "package-lock.json"
      - ".node-version"
      - ".python-version"
      - "pyproject.toml"
      - "uv.lock"
      - "toolchains/llvm/**"
      - "schemas/objc3-language-capabilities.json"
      - "native/**"
      - "scripts/**"
      - "tests/tooling/**"

permissions:
  contents: read

concurrency:
  group: objc3c-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-smoke:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      OBJC3C_CI_LLVM_VERSION: "23.1.3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.0"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15.0"

      - name: Install coherent LLVM toolchain
        shell: pwsh
        run: npm run objc3c -- materialize-ci-llvm --platform windows-x64

      - name: Install Node dependencies
        run: |
          npm install --global npm@12.2.1
          npm ci

      - name: Run canonical maintainer lint workflow
        run: npm run objc3c -- lint

      - name: Check development toolchain version references
        run: python -m scripts.objc3c_toolchain check-host-tools

      - name: Install Python test dependencies
        run: |
          python -m pip install uv==0.13.1
          uv export --locked --only-group dev --format requirements-txt --output-file "${{ runner.temp }}/objc3-dev-requirements.txt"
          uv pip install --system --require-hashes --requirements "${{ runner.temp }}/objc3-dev-requirements.txt"

      - name: Test toolchain pinning and build isolation
        run: python -m pytest -q tests/tooling/test_toolchain_host_tools.py tests/tooling/test_toolchain_build.py tests/tooling/test_objc3c_toolchain_prepare.py

      - name: Build native objc3c artifacts
        run: npm run objc3c -- build-native-binaries

      - name: Refresh binary-derived frontend contract artifacts
        run: npm run objc3c -- build-native-contracts

      - name: Probe hosted-runner LLVM capabilities without support promotion
        run: npm run objc3c -- check-hosted-llvm-capabilities

      - name: Validate capability discovery and routing code paths
        run: npm run objc3c -- test-llvm-capability-routing

      - name: Verify capability-routed source parity when llc object emission is available
        run: npm run objc3c -- test-capability-routed-source-parity

      - name: Run hosted native execution smoke when llc object emission is available
        run: npm run objc3c -- test-hosted-execution-smoke
