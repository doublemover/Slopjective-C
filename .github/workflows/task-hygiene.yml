name: ObjC3C Core CI

on:
  pull_request:
    paths:
      - ".github/workflows/task-hygiene.yml"
      - ".npmrc"
      - "package.json"
      - "package-lock.json"
      - "native/**"
      - "scripts/**"
      - "tests/tooling/**"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/task-hygiene.yml"
      - ".npmrc"
      - "package.json"
      - "package-lock.json"
      - "native/**"
      - "scripts/**"
      - "tests/tooling/**"

permissions:
  contents: read

concurrency:
  group: objc3c-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-smoke:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve LLVM object-emission tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Resolve-Executable {
            param(
              [Parameter(Mandatory = $true)]
              [string] $Name,
              [string[]] $CandidateDirectories = @()
            )
            foreach ($directory in $CandidateDirectories) {
              if ([string]::IsNullOrWhiteSpace($directory)) {
                continue
              }
              $candidate = Join-Path $directory $Name
              if (Test-Path -LiteralPath $candidate -PathType Leaf) {
                return (Resolve-Path -LiteralPath $candidate).Path
              }
            }
            $command = Get-Command $Name -ErrorAction SilentlyContinue
            if ($null -ne $command -and -not [string]::IsNullOrWhiteSpace($command.Source)) {
              return $command.Source
            }
            return $null
          }

          $candidateDirectories = @()
          if (-not [string]::IsNullOrWhiteSpace($env:LLVM_ROOT)) {
            $candidateDirectories += (Join-Path $env:LLVM_ROOT "bin")
          }
          $candidateDirectories += "C:\Program Files\LLVM\bin"

          $llc = Resolve-Executable -Name "llc.exe" -CandidateDirectories $candidateDirectories
          if ([string]::IsNullOrWhiteSpace($llc)) {
            choco install llvm -y --no-progress
            $candidateDirectories = @("C:\Program Files\LLVM\bin") + $candidateDirectories
            $llc = Resolve-Executable -Name "llc.exe" -CandidateDirectories $candidateDirectories
          }
          if ([string]::IsNullOrWhiteSpace($llc)) {
            throw "llc.exe was not found after LLVM tool resolution"
          }

          $llvmBin = Split-Path -Parent $llc
          Add-Content -Path $env:GITHUB_PATH -Value $llvmBin
          Add-Content -Path $env:GITHUB_ENV -Value "OBJC3C_NATIVE_EXECUTION_LLC_PATH=$llc"

          $clangxx = Resolve-Executable -Name "clang++.exe" -CandidateDirectories @($llvmBin)
          if (-not [string]::IsNullOrWhiteSpace($clangxx)) {
            Add-Content -Path $env:GITHUB_ENV -Value "OBJC3C_NATIVE_EXECUTION_CLANG_PATH=$clangxx"
          }
          "Resolved llc: $llc"
          "Resolved clang++: $clangxx"

      - name: Install Node dependencies
        run: npm ci

      - name: Run canonical maintainer lint workflow
        run: npm run objc3c -- lint

      - name: Install Python test dependencies
        run: python -m pip install --upgrade pytest

      - name: Build native objc3c artifacts
        run: npm run objc3c -- build-native-binaries

      - name: Refresh binary-derived frontend contract artifacts
        run: npm run objc3c -- build-native-contracts

      - name: Probe hosted-runner LLVM capabilities
        run: npm run objc3c -- check-hosted-llvm-capabilities

      - name: Validate capability discovery and routing code paths
        run: npm run objc3c -- test-llvm-capability-routing

      - name: Verify capability-routed source parity when llc is available
        run: npm run objc3c -- test-capability-routed-source-parity

      - name: Run hosted native execution smoke when llc is available
        run: npm run objc3c -- test-hosted-execution-smoke
