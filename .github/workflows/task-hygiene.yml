name: Native Linux tooling
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: linux-tooling-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  tooling:
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Provision the pinned Python and CMake toolchain
        uses: ./.github/actions/python-tools
      - name: Tool pins and generated capabilities
        run: |
          uv run python -m scripts.objc3c_toolchain check-host-tools
          uv run python -m scripts.objc3c_toolchain.generate_features --check
      - name: Python syntax and undefined names
        run: uv run ruff check --select F821 scripts tests/tooling
      - name: SDK integrity, installer and native validation owners
        run: >-
          uv run python -m pytest -q -ra
          -p scripts.objc3c_toolchain.pytest_inventory
          --execution-inventory=out/tooling/inventory.json
          --junitxml=out/tooling/results.xml
          tests/tooling/test_native_assurance.py
          tests/tooling/test_assurance_workflow_revision_modes.py
          tests/tooling/test_qualification_integrity.py
          tests/tooling/test_native_assurance_bootstrap.py
          tests/tooling/test_cloud_environment_setup.py
          tests/tooling/test_dependency_cache.py
          tests/tooling/test_source_cache.py
          tests/tooling/test_executor_lock_qualification.py
          tests/tooling/test_pytest_execution_inventory.py
          tests/tooling/test_toolchain_host_tools.py
          tests/tooling/test_toolchain_build.py
          tests/tooling/test_compiler_instrumentation_profiles.py
          tests/tooling/test_compiler_embedding_reuse.py
          tests/tooling/test_compiler_instrumentation_pipeline.py
          tests/tooling/test_compiler_instrumentation_evidence.py
          tests/tooling/test_compiler_archive_evidence.py
          tests/tooling/test_compiler_scan_graph.py
          tests/tooling/test_implementation_analysis.py
          tests/tooling/test_implementation_assurance.py
          tests/tooling/test_analysis_partitions.py
          tests/tooling/test_analysis_checkpoint.py
          tests/tooling/test_source_coverage.py
          tests/tooling/test_source_coverage_profile_merging.py
          tests/tooling/test_emitter_coverage_shards.py
          tests/tooling/test_upstream_test_tools.py
          tests/tooling/test_native_suite_collection.py
          tests/tooling/test_codec_fuzz.py
          tests/tooling/test_runtime_schedule_model.py
          tests/tooling/test_llvm_ir_assurance.py
          tests/tooling/test_semantic_oracles.py
          tests/tooling/test_semantic_benchmarks.py
          tests/tooling/test_semantic_runtime_workloads.py
          tests/tooling/test_semantic_ownership_workloads.py
          tests/tooling/test_semantic_task_frame_workloads.py
          tests/tooling/test_semantic_build_costs.py
          tests/tooling/test_semantic_import_benchmarks.py
          tests/tooling/test_swift_consumer.py
          tests/tooling/test_native_sanitizer_policy.py
          tests/tooling/test_product_command_evidence.py
          tests/tooling/test_sanitizer_product_campaign.py
          tests/tooling/test_objc3c_toolchain_prepare.py
          tests/tooling/test_development_patch_export.py
          tests/tooling/test_toolchain_package.py
          tests/tooling/test_toolchain_install.py
          tests/tooling/test_linux_sdk_reuse.py
          tests/tooling/test_frontend_serial_tests.py
          tests/tooling/test_frontend_runtime_dependency.py
          tests/tooling/test_isolated_frontend_cases.py
          tests/tooling/test_artifact_transport.py
          tests/tooling/test_linux_sdk_publication.py
          tests/tooling/test_source_graph.py
          tests/tooling/test_sdk_source_modules.py
          tests/tooling/test_binary_packages.py
          tests/tooling/test_current_onboarding.py
          tests/tooling/test_tooling_source_syntax.py
          tests/tooling/test_environment_tool_lookup_owner_split.py
          tests/tooling/test_workflow_command_result_owner_split.py
          tests/tooling/test_audit_objc3c_planning_publication.py
          tests/tooling/test_ownership_projection_qualification.py
          tests/tooling/test_public_surface_qualification.py tests/tooling/test_api_availability_qualification.py tests/tooling/test_module_spi_qualification.py
          tests/tooling/test_module_names_qualification.py
          tests/tooling/test_module_names_debugger_qualification.py
          tests/tooling/test_module_names_collision_debugger_qualification.py
          tests/tooling/test_structured_runtime_qualification.py
          tests/tooling/test_structured_runtime_sanitizers.py
          tests/tooling/test_task_coroutine_qualification.py
          tests/tooling/test_native_async_qualification.py
          tests/tooling/test_async_c_abi_qualification.py
          tests/tooling/test_stdlib_qualification.py
          tests/tooling/test_match_result_qualification.py
          tests/tooling/test_toolchain_runtime_report.py
          tests/tooling/test_runtime_source_patches.py
          tests/tooling/test_toolchain_facade_identity.py
          tests/tooling/test_clang_feature_authority.py
          tests/tooling/test_native_validation_editor.py
          tests/tooling/test_native_validation_plan.py
          tests/tooling/test_native_validation_artifacts.py
          tests/tooling/test_native_validation_cli.py
      - name: Describe quick-check scope
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as summary:
              summary.write('## Quick Linux checks\n\n'
                  'Automatic PR feedback covers tooling contracts and focused regression controls. '
                  'The artifact records the actual tests and explicit capability skips.\n\n'
                  'Full matched-compiler rebuilds, sanitizers, fuzzing, coverage and implementation '
                  'analysis run through the optional extended workflows and existing periodic/release owners. '
                  'A passing quick job does not qualify an SDK archive or a full compiler profile.\n')
          PY
      - name: Preserve actual tooling inventory and skip reasons
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tooling-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/tooling/
          if-no-files-found: error
          retention-days: 7
