name: Extended Linux implementation analysis
on:
  schedule:
    - cron: "19 7 * * 0"
  workflow_dispatch:
    inputs:
      linux_host:
        description: Native compiler and SDK architecture
        type: choice
        options: [linux-x86_64, linux-aarch64]
        default: linux-x86_64
      comparison_base:
        description: Optional ancestor commit SHA for dependency-selected analysis
        type: string
        default: ''
  workflow_call:
    inputs:
      linux_host:
        description: Native compiler and SDK architecture
        type: string
        default: linux-x86_64
      source_sha:
        required: true
        type: string
      foundation_archive_sha256:
        description: Exact analysis bundle from the same-run sanitizer compiler producer
        type: string
        default: ''
env:
  OBJC3C_REQUESTED_HOST: ${{ inputs.linux_host || 'linux-x86_64' }}
  OBJC3C_ANALYSIS_COMPARISON_BASE: ${{ inputs.comparison_base || '' }}
permissions:
  contents: read
concurrency:
  group: ${{ inputs.linux_host || 'linux-x86_64' }}-linux-implementation-analysis-${{ inputs.source_sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    name: Select exact implementation revision
    runs-on: ${{ inputs.linux_host == 'linux-aarch64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    timeout-minutes: 5
    outputs:
      analysis: ${{ steps.plan.outputs.analysis }}
      partitions: ${{ steps.plan.outputs.partitions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python3 -B scripts/objc3c_toolchain/linux_host.py --expect-host "$OBJC3C_REQUESTED_HOST" --field host
          periodic=()
          if [[ -n "$SOURCE_SHA" ]]; then
            periodic=(--periodic-sha "$SOURCE_SHA")
          elif [[ "$GITHUB_EVENT_NAME" == schedule || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            periodic=(--periodic-sha "$GITHUB_SHA")
          fi
          python3 -B -m scripts.objc3c_implementation_assurance plan --plan out/implementation-assurance/plan.json "${periodic[@]}"
      - name: Preserve exact selection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: implementation-plan-${{ inputs.source_sha || github.sha }}-${{ inputs.linux_host || 'linux-x86_64' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/implementation-assurance/plan.json
          if-no-files-found: error
          retention-days: 7
  foundation:
    name: Build the exact shared analysis compiler
    needs: plan
    if: needs.plan.outputs.analysis == 'true' && inputs.foundation_archive_sha256 == ''
    runs-on: ${{ inputs.linux_host == 'linux-aarch64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    container:
      image: debian:13
      options: --security-opt seccomp=unconfined
    timeout-minutes: 180
    outputs:
      archive_sha256: ${{ steps.foundation-run.outputs.archive_sha256 }}
    env:
      OBJC3C_CLOUD_SETUP_ROOT: /opt/objc3c-host
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Development prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git curl ca-certificates gnupg python3 python3-venv xz-utils zstd g++ zlib1g-dev libzstd-dev libssl-dev libxml2 libcurl4 libedit2 libsqlite3-0 libncurses6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: implementation-plan-${{ inputs.source_sha || github.sha }}-${{ inputs.linux_host || 'linux-x86_64' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/implementation-assurance/selection
      - uses: ./.github/actions/linux-host-tools
        with:
          output: out/implementation-assurance/foundation-startup
      - name: Require sanitizer process layout support
        run: |
          g++ tests/tooling/fixtures/native_container/personality.c -o out/implementation-assurance/native-container-control
          out/implementation-assurance/native-container-control
      - name: Build and seal analysis foundation
        id: foundation-run
        shell: bash
        run: |
          source /opt/objc3c-host/activate.sh
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ulimit -c 0
          python3 -B scripts/objc3c_toolchain/linux_host.py --expect-host "$OBJC3C_REQUESTED_HOST" --field host
          periodic=()
          if [[ -n "$SOURCE_SHA" ]]; then
            periodic=(--periodic-sha "$SOURCE_SHA")
          elif [[ "$GITHUB_EVENT_NAME" == schedule || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            periodic=(--periodic-sha "$GITHUB_SHA")
          fi
          python3 -B -m scripts.objc3c_implementation_assurance foundation --plan out/implementation-assurance/selection/plan.json --output out/implementation-assurance/foundation-product "${periodic[@]}"
      - name: Preserve the matching compiler and compilation graph
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: implementation-foundation-${{ inputs.source_sha || github.sha }}-${{ inputs.linux_host || 'linux-x86_64' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/implementation-assurance/foundation-product/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Preserve compiler producer diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: implementation-foundation-diagnostics-${{ inputs.source_sha || github.sha }}-${{ inputs.linux_host || 'linux-x86_64' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/implementation-assurance/foundation-startup/
            out/implementation-assurance/foundation-product/producer.json
            out/implementation-assurance/foundation-product/foundation/
          if-no-files-found: ignore
          retention-days: 7
  analysis:
    name: Analyze fork-matched implementation (partition ${{ matrix.partition }})
    strategy:
      fail-fast: true
      matrix:
        partition: ${{ fromJSON(needs.plan.outputs.partitions) }}
    needs: [plan, foundation]
    if: ${{ !cancelled() && needs.plan.outputs.analysis == 'true' && (needs.foundation.result == 'success' || inputs.foundation_archive_sha256 != '') }}
    runs-on: ${{ inputs.linux_host == 'linux-aarch64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    container:
      image: debian:13
      options: --security-opt seccomp=unconfined
    timeout-minutes: 360
    env:
      OBJC3C_CLOUD_SETUP_ROOT: /opt/objc3c-host
      SOURCE_SHA: ${{ inputs.source_sha }}
      ANALYSIS_PARTITION_INDEX: ${{ matrix.partition }}
      ANALYSIS_FOUNDATION_SHA256: ${{ inputs.foundation_archive_sha256 || needs.foundation.outputs.archive_sha256 }}
    steps:
      - name: Development prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git curl ca-certificates gnupg python3 python3-venv xz-utils zstd g++ zlib1g-dev libzstd-dev libssl-dev libxml2 libcurl4 libedit2 libsqlite3-0 libncurses6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: implementation-plan-${{ inputs.source_sha || github.sha }}-${{ inputs.linux_host || 'linux-x86_64' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/implementation-assurance/selection
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: implementation-foundation-${{ inputs.source_sha || github.sha }}-${{ inputs.linux_host || 'linux-x86_64' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/implementation-assurance/foundation-input
      - name: Pinned host tools
        id: host-tools
        uses: ./.github/actions/linux-host-tools
        with:
          output: out/implementation-assurance/startup
      - name: Build and analyze selected implementation
        id: analysis-run
        shell: bash
        run: |
          source /opt/objc3c-host/activate.sh
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ulimit -c 0
          python3 -B scripts/objc3c_toolchain/linux_host.py --expect-host "$OBJC3C_REQUESTED_HOST" --field host
          periodic=()
          if [[ -n "$SOURCE_SHA" ]]; then
            periodic=(--periodic-sha "$SOURCE_SHA")
          elif [[ "$GITHUB_EVENT_NAME" == schedule || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            periodic=(--periodic-sha "$GITHUB_SHA")
          fi
          python3 -B -m scripts.objc3c_implementation_assurance run --plan out/implementation-assurance/selection/plan.json --output out/implementation-assurance/results --foundation-bundle out/implementation-assurance/foundation-input --foundation-archive-sha256 "$ANALYSIS_FOUNDATION_SHA256" --partition-index "$ANALYSIS_PARTITION_INDEX" "${periodic[@]}"
      - name: Preserve setup diagnostics
        if: always() && steps.host-tools.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: implementation-startup-${{ inputs.source_sha || github.sha }}-${{ inputs.linux_host || 'linux-x86_64' }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.partition }}
          path: out/implementation-assurance/startup/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve analysis evidence
        if: always() && steps.analysis-run.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: implementation-results-${{ inputs.source_sha || github.sha }}-${{ inputs.linux_host || 'linux-x86_64' }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.partition }}
          path: |
            out/implementation-assurance/results/**/*.json
            out/implementation-assurance/results/**/*.xml
            out/implementation-assurance/results/**/*.log
            out/implementation-assurance/results/**/*.yaml
            out/implementation-assurance/results/**/*.d
            !out/implementation-assurance/results/**/build/**
          if-no-files-found: error
          retention-days: 7
  gate:
    name: Extended Linux implementation analysis gate
    if: always()
    needs: [plan, foundation, analysis]
    runs-on: ${{ inputs.linux_host == 'linux-aarch64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    timeout-minutes: 5
    steps:
      - name: Require analysis outcomes before downloading evidence
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          REQUIRED: ${{ needs.plan.outputs.analysis }}
          ANALYSIS_RESULT: ${{ needs.analysis.result }}
          FOUNDATION_RESULT: ${{ needs.foundation.result }}
          SHARED_ARCHIVE: ${{ inputs.foundation_archive_sha256 }}
        shell: bash
        run: |
          printf 'Plan: %s\nFoundation: %s\nAnalysis: %s\n' \
            "$PLAN_RESULT" "$FOUNDATION_RESULT" "$ANALYSIS_RESULT" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$PLAN_RESULT" != success ]] ||
             [[ "$REQUIRED" == true && "$ANALYSIS_RESULT" != success ]] ||
             [[ "$REQUIRED" == true && "$SHARED_ARCHIVE" == '' && "$FOUNDATION_RESULT" != success ]]; then
            echo "::error::Implementation analysis failed (plan=$PLAN_RESULT foundation=$FOUNDATION_RESULT analysis=$ANALYSIS_RESULT)"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Read exact selection
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: implementation-plan-${{ inputs.source_sha || github.sha }}-${{ inputs.linux_host || 'linux-x86_64' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/plan
      - name: Read implementation evidence
        if: needs.plan.outputs.analysis == 'true' && needs.analysis.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: implementation-results-${{ inputs.source_sha || github.sha }}-${{ inputs.linux_host || 'linux-x86_64' }}-${{ github.run_id }}-${{ github.run_attempt }}-*
          merge-multiple: false
          path: evidence/results
      - name: Require exact-revision complete passing analysis
        env:
          ASSURANCE_OUTCOMES: >-
            {"plan":"${{ needs.plan.result }}","foundation":"${{ inputs.foundation_archive_sha256 != '' && 'success' || needs.foundation.result }}","foundation_archive":"${{ inputs.foundation_archive_sha256 || needs.foundation.outputs.archive_sha256 }}","analysis":"${{ needs.analysis.result }}"}
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          python3 -B scripts/objc3c_toolchain/linux_host.py --expect-host "$OBJC3C_REQUESTED_HOST" --field host
          periodic=()
          if [[ -n "$SOURCE_SHA" ]]; then
            periodic=(--periodic-sha "$SOURCE_SHA")
          elif [[ "$GITHUB_EVENT_NAME" == schedule || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            periodic=(--periodic-sha "$GITHUB_SHA")
          fi
          python3 -B -m scripts.objc3c_implementation_assurance verify --plan evidence/plan/plan.json --output evidence/results "${periodic[@]}"
