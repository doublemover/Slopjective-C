name: Inspect retained CI artifact
on:
  workflow_dispatch:
    inputs:
      artifact_id:
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read ZIP inventory and bounded receipts
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
        run: python3 -B -m scripts.objc3c_assurance.artifact_diagnostics
