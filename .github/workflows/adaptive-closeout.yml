name: Maintenance / closeout
permissions:
  contents: read
jobs:
  compiler-closeout:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.source_sha }}
        persist-credentials: false
    - name: Verify and record source revision
      shell: bash
      env:
        EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
      run: |
        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
        printf "Tested source: %s\n" "$EXPECTED_SOURCE_SHA"
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install Node dependencies
      run: npm ci
    - name: Build full native objc3c closeout surface
      run: npm run objc3c -- build-native-full
'on':
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
        description: Immutable source SHA resolved by the trusted adaptive dispatcher
