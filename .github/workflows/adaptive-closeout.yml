name: Budgeted native compiler closeout
on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  compiler-closeout:
    name: compiler-closeout (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [core, frontend-fuzz, source-coverage]
    runs-on: ubuntu-26.04
    container:
      image: debian:13
      # TSan adjusts its own ASLR layout with personality(2).
      options: --security-opt seccomp=unconfined
    timeout-minutes: 360
    env:
      OBJC3C_CLOUD_SETUP_ROOT: /opt/objc3c-host
      SOURCE_SHA: ${{ inputs.source_sha }}
      NATIVE_SHARD: ${{ matrix.shard }}
    steps:
      - name: Development prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git curl ca-certificates gnupg python3 python3-venv xz-utils zstd g++ zlib1g-dev libzstd-dev libssl-dev libxml2 libcurl4 libedit2 libsqlite3-0 libncurses6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Pinned host tools
        uses: ./.github/actions/linux-host-tools
        with:
          output: out/native-assurance/startup
          include_swift: ${{ matrix.shard == 'core' }}
      - name: Require sanitizer process layout support
        run: |
          mkdir -p out
          g++ tests/tooling/fixtures/native_container/personality.c -o out/native-container-control
          out/native-container-control
      - name: Select immutable periodic source
        shell: bash
        run: |
          source /opt/objc3c-host/activate.sh
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 -B -m scripts.objc3c_assurance plan --periodic-sha "$SOURCE_SHA" --plan out/native-assurance/plan.json
      - name: Build full native objc3c closeout surface
        id: native
        shell: bash
        run: |
          source /opt/objc3c-host/activate.sh
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ulimit -c 0
          python3 -B -m scripts.objc3c_assurance run --periodic-sha "$SOURCE_SHA" --plan out/native-assurance/plan.json --output out/native-assurance/results --shard "$NATIVE_SHARD"
      - name: Stage durable periodic evidence
        if: always()
        shell: bash
        run: |
          source /opt/objc3c-host/activate.sh
          python3 -B -m scripts.objc3c_assurance publish --periodic-sha "$SOURCE_SHA" --plan out/native-assurance/plan.json --output out/native-assurance/results --shard "$NATIVE_SHARD" --destination "out/native-assurance/evidence/$NATIVE_SHARD"
      - name: Preserve periodic setup diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-closeout-startup-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: |
            out/native-assurance/startup/
            out/native-assurance/plan.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve periodic native evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-closeout-results-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: out/native-assurance/evidence/
          if-no-files-found: error
          retention-days: 7
  gate:
    name: Verify exact-revision periodic evidence
    if: always()
    needs: compiler-closeout
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-closeout-results-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}-*
          merge-multiple: true
          path: evidence/results
      - name: Verify all periodic execution shards
        if: always()
        env:
          ASSURANCE_OUTCOMES: '{"plan":"success","native":"${{ needs.compiler-closeout.result }}"}'
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          python3 -B -m scripts.objc3c_assurance plan --periodic-sha "$SOURCE_SHA" --plan evidence/plan.json
          python3 -B -m scripts.objc3c_assurance verify --sharded --periodic-sha "$SOURCE_SHA" --plan evidence/plan.json --output evidence/results
