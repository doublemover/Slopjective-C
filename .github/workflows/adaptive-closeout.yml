name: Budgeted native compiler closeout
on:
  workflow_call:
    inputs:
      linux_host:
        description: Native compiler and SDK architecture
        type: string
        default: linux-x86_64
      source_sha:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  source:
    name: Admit immutable periodic source
    runs-on: ubuntu-26.04
    steps:
      - name: Require the dispatcher revision
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ || "$SOURCE_SHA" == 0000000000000000000000000000000000000000 || "$SOURCE_SHA" != "$GITHUB_SHA" ]]; then
            echo '::error::Periodic source must equal the immutable dispatcher SHA'
            exit 1
          fi
  native:
    name: Execute current native qualification
    needs: source
    uses: ./.github/workflows/native-assurance.yml
    with:
      linux_host: ${{ inputs.linux_host }}
      archive_install: false
  gate:
    name: Verify exact-revision periodic evidence
    if: "!cancelled()"
    needs: [source, native]
    runs-on: ubuntu-26.04
    steps:
      - name: Require exact native terminal evidence
        env:
          SOURCE_RESULT: ${{ needs.source.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          if [[ "$SOURCE_RESULT" != success || "$NATIVE_RESULT" != success || "$SOURCE_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::Periodic closeout failed (source=$SOURCE_RESULT native=$NATIVE_RESULT)"
            exit 1
          fi
          printf 'Verified canonical native qualification at %s\n' "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
